version: 2
project_name: netris
builds:
  -
    id: netris
    binary: netris
    main: ./cmd/netris
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X codeberg.org/tslocum/netris/pkg/game.Version={{.Version}}
    goos:
      - darwin
      - freebsd
      - linux
      - windows
    goarch:
      - 386
      - amd64
  -
    id: netris-server
    binary: netris-server
    main: ./cmd/netris-server
    ldflags:
      - -s -w -X codeberg.org/tslocum/netris/pkg/game.Version={{.Version}}
    goos:
      - darwin
      - freebsd
      - linux
      - windows
    goarch:
      - 386
      - amd64
archives:
  -
    ids:
      - netris
      - netris-server
    wrap_in_directory: netris
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- tolower .Os }}_
      {{- if eq .Arch "386" }}i386{{ else }}
      {{- tolower .Arch }}{{ end -}}
    format_overrides:
      - goos: windows
        formats: [ 'zip' ]
    files:
      - ./*.md
      - CHANGELOG
      - LICENSE
checksum:
  name_template: 'checksums.txt'
